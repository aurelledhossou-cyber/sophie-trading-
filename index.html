<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sophie Trading — Double Structure</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{background:#0a0c10;font-family:'IBM Plex Mono',monospace;color:#c8d8e8;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,157,0.008) 3px,rgba(0,255,157,0.008) 4px)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0a0c10}::-webkit-scrollbar-thumb{background:#1c2a38;border-radius:3px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
@keyframes ticker{from{transform:translateX(100vw)}to{transform:translateX(-200%)}}
button{font-family:inherit;cursor:pointer}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:rgba(10,12,16,.97);backdrop-filter:blur(12px);border-bottom:1px solid #1a2a3a}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:58px;gap:8px}
.logo-icon{width:32px;height:32px;border-radius:7px;background:linear-gradient(135deg,#00ff9d,#00c4ff);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;box-shadow:0 0 14px rgba(0,255,157,.3)}
.logo-text{font-size:12px;font-weight:700;letter-spacing:2px;color:#e8f4ff}
.logo-sub{font-size:7px;color:#3a5068;letter-spacing:2px}
.progress{height:2px;background:#0a0c10;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#00ff9d,#00c4ff);transition:width .3s;box-shadow:0 0 8px #00ff9d}

/* TICKER */
.ticker-wrap{overflow:hidden;background:rgba(0,255,157,.03);border-bottom:1px solid rgba(0,255,157,.08);height:26px;display:flex;align-items:center}
.ticker-inner{display:flex;gap:36px;white-space:nowrap;animation:ticker 80s linear infinite;padding-left:100%}
.ticker-item{font-size:9px;letter-spacing:1px;display:flex;gap:5px;align-items:center}

/* STRATEGY BANNER */
.strat-banner{background:rgba(0,12,24,.95);border-bottom:1px solid #0d2030;padding:5px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.strat-tag{font-size:7px;letter-spacing:1px;padding:3px 8px;border-radius:4px;border:1px solid}

/* LAYOUT */
.layout{display:flex;max-width:1600px;margin:0 auto}
.sidebar{width:252px;min-height:calc(100vh - 90px);border-right:1px solid #1a2a3a;flex-shrink:0;overflow-y:auto;padding:16px 12px}

/* DRAWER */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none}
.drawer{position:fixed;top:0;left:0;bottom:0;width:272px;background:#0d1117;border-right:1px solid #1a2a3a;z-index:201;overflow-y:auto;padding:68px 12px 16px;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.drawer.open{transform:translateX(0)}
.drawer-close{position:absolute;top:12px;right:12px;background:transparent;border:1px solid #1c2a38;color:#6a8aaa;border-radius:5px;padding:4px 10px;font-size:13px}

/* SIDEBAR CONTENT */
.s-label{font-size:7px;letter-spacing:3px;color:#3a5068;display:block;margin-bottom:8px}
/* TIMEFRAME BUTTONS — actifs */
.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:18px}
.tf-btn{padding:10px 8px;font-size:10px;letter-spacing:1px;border-radius:6px;border:1px solid #1c2a38;background:transparent;color:#3a5068;transition:all .15s;font-weight:500}
.tf-btn.active{border-color:rgba(0,255,157,.5);background:rgba(0,255,157,.1);color:#00ff9d;box-shadow:0 0 10px rgba(0,255,157,.15)}
.tf-btn:hover:not(.active){border-color:#2a3a4a;color:#6a8aaa}
/* GROUP BUTTONS */
.grp-row{display:flex;gap:5px;margin-bottom:16px}
.grp-btn{flex:1;padding:7px 4px;font-size:8px;letter-spacing:1px;border-radius:4px;border:1px solid #1c2a38;background:transparent;color:#3a5068;transition:all .15s}
.grp-btn:hover{border-color:#2a3a4a;color:#c8d8e8}
/* PAIR ROWS */
.pair-section{margin-bottom:12px}
.pair-section-label{font-size:7px;letter-spacing:2px;color:#2a3a48;text-align:center;margin-bottom:5px}
.pair-row{display:flex;align-items:center;justify-content:space-between;padding:7px 8px;margin-bottom:2px;border-radius:5px;cursor:pointer;border:1px solid transparent;transition:all .12s}
.pair-row.sel{background:rgba(0,255,157,.06);border-color:rgba(0,255,157,.18)}
.pair-row:hover{background:rgba(255,255,255,.03)}
.chk{width:13px;height:13px;border-radius:2px;border:1px solid #2a3a4a;background:transparent;display:flex;align-items:center;justify-content:center;font-size:8px;color:#00ff9d;flex-shrink:0}
.chk.on{border-color:#00ff9d;background:rgba(0,255,157,.15)}
.pair-name{font-size:10px;margin-left:7px}
.pair-price{font-size:8px;font-family:monospace;color:#6a8aaa}

/* SCANNER BUTTON — grand et visible */
.scan-btn{width:100%;padding:13px;border-radius:8px;font-size:11px;letter-spacing:3px;font-weight:700;border:1px solid rgba(0,255,157,.4);background:linear-gradient(135deg,rgba(0,255,157,.1),rgba(0,196,255,.1));color:#00ff9d;margin-top:16px;transition:all .2s;text-align:center}
.scan-btn:hover{background:linear-gradient(135deg,rgba(0,255,157,.2),rgba(0,196,255,.2));box-shadow:0 0 16px rgba(0,255,157,.2)}
.scan-btn:disabled{opacity:.5;cursor:not-allowed}
.scan-btn.scanning{color:#00c4ff;border-color:rgba(0,196,255,.4);animation:pulse .8s infinite}

/* MAIN */
.main{flex:1;padding:16px;min-width:0}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat-card{background:rgba(255,255,255,.02);border:1px solid #1a2a3a;border-radius:8px;padding:12px;border-top:2px solid}
.stat-label{font-size:7px;letter-spacing:2px;color:#3a5068;margin-bottom:3px}
.stat-val{font-size:26px;font-weight:700;font-family:monospace}

/* TABS */
.tabs{display:flex;border-bottom:1px solid #1a2a3a;margin-bottom:14px;overflow-x:auto}
.tab-btn{padding:9px 14px;font-size:8px;letter-spacing:2px;border:none;background:transparent;color:#3a5068;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap}
.tab-btn.active{color:#00ff9d;border-bottom-color:#00ff9d}
.filter-row{display:flex;align-items:center;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.fbtn{padding:5px 9px;font-size:7px;letter-spacing:1px;border-radius:4px;border:1px solid #1c2a38;background:transparent;color:#3a5068;transition:all .15s}
.fbtn.active{border-color:rgba(0,255,157,.4);background:rgba(255,255,255,.05);color:#00ff9d}

/* ALERT CARDS */
.alert-card{background:rgba(255,255,255,.025);border:1px solid #1a2a3a;border-radius:9px;padding:14px;margin-bottom:9px;border-left:3px solid;animation:fadeIn .3s ease}
.price-lbl{font-size:7px;letter-spacing:2px;color:#3a5068;margin-bottom:3px}
.strength-badge{font-size:8px;padding:3px 9px;border-radius:4px;border:1px solid;letter-spacing:1px;font-weight:600;display:inline-block}
.score-wrap{height:3px;background:#1a2a3a;border-radius:2px;margin-top:3px;overflow:hidden}
.score-fill{height:100%;border-radius:2px}
.info-row{font-size:7px;color:#3a5068;line-height:1.8;padding:6px 8px;background:rgba(255,255,255,.02);border-radius:5px;margin-top:8px}
.dir-badge{font-size:8px;padding:2px 7px;border-radius:3px;border:1px solid;letter-spacing:1px}
.candle-badge{font-size:8px;padding:2px 8px;border-radius:3px;background:rgba(167,139,255,.12);border:1px solid rgba(167,139,255,.3);color:#a78bff;letter-spacing:1px}

/* EMPTY */
.empty{text-align:center;padding:60px 16px;border:1px dashed #1c2a38;border-radius:12px}
.empty-icon{font-size:36px;margin-bottom:12px;opacity:.6}
.empty-txt{font-size:9px;letter-spacing:2px;color:#3a5068}

/* PRICE GRID */
.price-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.price-card{background:rgba(255,255,255,.025);border:1px solid #1a2a3a;border-radius:8px;padding:12px;border-left:3px solid}

/* STRATEGY / RULES */
.steps-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step-card{background:rgba(255,255,255,.02);border:1px solid #1a2a3a;border-radius:9px;padding:14px;border-top:2px solid;animation:fadeIn .3s ease}
.rule-card{display:flex;gap:10px;padding:12px 14px;margin-bottom:7px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid;border-left:3px solid;animation:fadeIn .3s ease}

/* TOASTS */
#toasts{position:fixed;top:65px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:7px;max-width:290px}
.toast{padding:8px 12px;border-radius:6px;font-size:9px;letter-spacing:1px;border:1px solid;backdrop-filter:blur(8px);animation:fadeIn .3s ease}

/* HEADER BTNS */
.hbtn{padding:6px 12px;border-radius:5px;font-size:8px;letter-spacing:1px;border:1px solid;transition:all .15s}
.hbtn-refresh{border-color:rgba(245,200,66,.35);background:rgba(245,200,66,.06);color:#f5c842}
.hbtn-auto.on{border-color:rgba(0,255,157,.35);background:rgba(0,255,157,.08);color:#00ff9d}
.hbtn-auto.off{border-color:rgba(255,92,124,.35);background:rgba(255,92,124,.06);color:#ff5c7c}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block;margin-right:4px}
.dot-g{background:#00ff9d;box-shadow:0 0 6px #00ff9d;animation:pulse 1.5s infinite}
.dot-r{background:#ff5c7c;box-shadow:0 0 6px #ff5c7c}
.dot-y{background:#f5c842;box-shadow:0 0 6px #f5c842;animation:pulse .8s infinite}
.status-pill{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:5px;font-size:7px;letter-spacing:2px;border:1px solid}

/* MOBILE */
.burger{background:transparent;border:1px solid #1c2a38;color:#6a8aaa;border-radius:5px;padding:5px 9px;font-size:15px;line-height:1}
.hide-mobile{display:inline}
@media(max-width:1100px){.sidebar{display:none}}
@media(max-width:768px){
  .main{padding:10px}
  .stats{grid-template-columns:1fr 1fr;gap:7px}
  .stat-val{font-size:22px}
  .steps-grid{grid-template-columns:1fr}
  .price-grid{grid-template-columns:1fr}
  .hide-mobile{display:none}
  #toasts{right:8px;max-width:calc(100vw - 16px)}
  .hdr{padding:0 10px;height:54px}
}
</style>
</head>
<body>

<div id="toasts"></div>

<header>
  <div class="hdr">
    <div style="display:flex;align-items:center;gap:9px">
      <button class="burger" id="burgerBtn" onclick="toggleDrawer()" style="display:none">☰</button>
      <div class="logo-icon">🎯</div>
      <div>
        <div class="logo-text">SOPHIE TRADING</div>
        <div class="logo-sub">DOUBLE STRUCTURE · 6 ÉTAPES</div>
      </div>
    </div>
    <div id="statusPill" class="status-pill" style="border-color:rgba(58,80,104,.4);color:#3a5068">
      <span class="dot dot-g" id="sDot" style="background:#3a5068;box-shadow:none;animation:none"></span>
      <span id="sLabel">PRÊT</span>
      <span id="sTime" style="font-size:6px;color:#3a5068;margin-left:4px"></span>
    </div>
    <div style="display:flex;align-items:center;gap:7px">
      <div id="cntdown" style="font-size:8px;color:#3a5068">SYNC : <span style="color:#00ff9d">60s</span></div>
      <button class="hbtn hbtn-refresh" onclick="refreshPrices()">🔄<span class="hide-mobile"> COURS</span></button>
      <button class="hbtn hbtn-auto off" id="autoBtn" onclick="toggleAuto()">
        <span class="dot dot-r" id="autoDot"></span><span id="autoLbl">AUTO</span>
      </button>
    </div>
  </div>
  <div class="progress"><div class="progress-fill" id="progBar" style="width:0"></div></div>
</header>

<!-- TICKER -->
<div class="ticker-wrap"><div class="ticker-inner" id="ticker">
  <span class="ticker-item" style="color:#3a5068">⏳ Chargement des cours...</span>
</div></div>

<!-- STRATEGY BANNER -->
<div class="strat-banner">
  <span style="font-size:7px;letter-spacing:2px;color:#3a5068">STRATÉGIE :</span>
  <span class="strat-tag" style="color:#00c4ff;border-color:rgba(0,196,255,.3);background:rgba(0,196,255,.06)">1 TENDANCE DOW</span>
  <span class="strat-tag" style="color:#a78bff;border-color:rgba(167,139,255,.3);background:rgba(167,139,255,.06)">2 FIGURE FIN TENDANCE</span>
  <span class="strat-tag" style="color:#f5c842;border-color:rgba(245,200,66,.3);background:rgba(245,200,66,.06)">3 ZONE ≥2 RETESTS</span>
  <span class="strat-tag" style="color:#ff7c5c;border-color:rgba(255,124,92,.3);background:rgba(255,124,92,.06)">4 ZONES PSY</span>
  <span class="strat-tag" style="color:#00ff9d;border-color:rgba(0,255,157,.3);background:rgba(0,255,157,.06)">5 BOUGIE CONFIRMATION</span>
  <span class="strat-tag" style="color:#ff4d6d;border-color:rgba(255,77,109,.3);background:rgba(255,77,109,.06)">6 MANAGEMENT</span>
</div>

<!-- DRAWER MOBILE -->
<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <button class="drawer-close" onclick="toggleDrawer()">✕</button>
  <div id="drawerContent"></div>
</div>

<div class="layout">

  <!-- SIDEBAR STATIQUE DESKTOP -->
  <aside class="sidebar" id="sidebarStatic"></aside>

  <!-- MAIN -->
  <main class="main">

    <!-- STATS -->
    <div class="stats">
      <div class="stat-card" style="border-top-color:#00ff9d44">
        <div class="stat-label">🟢 CONFIRME</div>
        <div class="stat-val" id="stTotal" style="color:#00ff9d">0</div>
      </div>
      <div class="stat-card" style="border-top-color:#ff994444">
        <div class="stat-label">🟠 SUR ZONE</div>
        <div class="stat-val" id="stStrong" style="color:#ff9944">0</div>
      </div>
      <div class="stat-card" style="border-top-color:#f5c84244">
        <div class="stat-label">🟡 EN APPROCHE</div>
        <div class="stat-val" id="stMed" style="color:#f5c842">0</div>
      </div>
      <div class="stat-card" style="border-top-color:#3399ff44">
        <div class="stat-label">📊 TOTAL</div>
        <div class="stat-val" id="stWeak" style="color:#3399ff">0</div>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn active" onclick="setTab('alerts')"   id="tab-alerts">📡 SIGNAUX</button>
      <button class="tab-btn"        onclick="setTab('prices')"   id="tab-prices">💹 COURS</button>
      <button class="tab-btn"        onclick="setTab('strategy')" id="tab-strategy">📋 STRATÉGIE</button>
      <button class="tab-btn"        onclick="setTab('rules')"    id="tab-rules">⚠️ RÈGLES</button>
    </div>

    <div id="tabContent"></div>
  </main>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
const S = {
  signals: [], prices: {}, lastUpdate: null,
  selectedTF: "4H",
  selectedPairs: new Set(["EUR/USD","GBP/USD","USD/JPY","AUD/USD"]),
  filterStrength: "ALL", filterDir: "ALL",
  autoScan: false, activeTab: "alerts",
  scanning: false, countdown: 60,
  isMobile: ()=> window.innerWidth < 768,
  isDesktop: ()=> window.innerWidth >= 1100,
};

const MAJOR = ["EUR/USD","GBP/USD","USD/JPY","USD/CHF","AUD/USD","NZD/USD","USD/CAD"];
const MINOR = ["EUR/GBP","EUR/JPY","EUR/CHF","EUR/AUD","EUR/NZD","GBP/JPY","GBP/CHF","GBP/AUD","GBP/NZD","AUD/JPY","AUD/NZD","AUD/CHF","AUD/CAD","NZD/JPY","NZD/CHF","NZD/CAD","CAD/JPY","CAD/CHF","CHF/JPY"];
const TFS   = ["4H","2H","1H","30min"];
const API   = window.location.origin;

// ── HELPERS ────────────────────────────────────────────────────────────────
const sc = s=> s==="FORT"?"#00ff9d":s==="MOYEN"?"#f5c842":"#ff7c5c";
const dc = d=> d==="LONG"?"#00ff9d":"#ff5c7c";
const fmtP = (n,p)=> n?(p&&p.includes("JPY")?n.toFixed(3):n.toFixed(5)):"—";
const ago  = ts=>{ if(!ts)return "—"; const s=Math.floor((Date.now()-new Date(ts))/1000); return s<60?s+"s":s<3600?Math.floor(s/60)+"min":Math.floor(s/3600)+"h"; };

function toast(msg, type="info"){
  const t=document.getElementById("toasts");
  const d=document.createElement("div");
  d.className="toast";
  const clrs={alert:["rgba(0,255,157,.12)","rgba(0,255,157,.3)","#00ff9d"],warn:["rgba(255,124,92,.1)","rgba(255,124,92,.3)","#ff7c5c"],info:["rgba(0,196,255,.1)","rgba(0,196,255,.25)","#00c4ff"]};
  const [bg,bc,c]=clrs[type]||clrs.info;
  d.style.cssText=`background:${bg};border-color:${bc};color:${c}`;
  d.textContent=msg; t.appendChild(d);
  setTimeout(()=>d.remove(),5000);
}

function setStatus(state){ // "idle"|"loading"|"live"|"error"
  const dot=document.getElementById("sDot");
  const lbl=document.getElementById("sLabel");
  const pill=document.getElementById("statusPill");
  const map={idle:["#3a5068","PRÊT","none",".4"],loading:["#f5c842","SCAN...","pulse .8s infinite",".35"],live:["#00ff9d","LIVE","pulse 3s infinite",".3"],error:["#ff5c7c","ERREUR","none",".3"]};
  const [col,txt,anim,op]=map[state]||map.idle;
  dot.style.cssText=`width:6px;height:6px;border-radius:50%;background:${col};box-shadow:0 0 6px ${col};animation:${anim};display:inline-block;margin-right:4px`;
  lbl.textContent=txt;
  pill.style.borderColor=`rgba(${col=="#00ff9d"?"0,255,157":col=="#f5c842"?"245,200,66":col=="#ff5c7c"?"255,92,124":"58,80,104"},${op})`;
  pill.style.color=col;
}

// ── SPARKLINE ──────────────────────────────────────────────────────────────
function spark(data, color, w=55, h=20){
  if(!data||data.length<2)return "";
  const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-mn)/rng)*h}`).join(" ");
  return `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" opacity=".7"/></svg>`;
}

// ── SCAN (appel POST /api/scan) ────────────────────────────────────────────
async function runScan(){
  if(S.scanning) return;
  S.scanning=true;
  const btn=document.getElementById("scanBtn");
  if(btn){btn.disabled=true;btn.className="scan-btn scanning";btn.textContent="⏳ ANALYSE EN COURS...";}
  setStatus("loading");
  document.getElementById("progBar").style.width="20%";

  try{
    const resp = await fetch(`${API}/api/scan`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        timeframe: S.selectedTF,
        pairs:     [...S.selectedPairs]
      })
    });
    document.getElementById("progBar").style.width="70%";
    const data = await resp.json();

    if(data.signals){
      S.signals    = data.signals;
      S.lastUpdate = data.timestamp;
      updateStats(data.signals);
      setStatus("live");
      document.getElementById("sTime").textContent = new Date(data.timestamp).toLocaleTimeString("fr-FR");

      if(data.eco_blocked && data.eco_events.length>0)
        toast(`⛔ Annonces économiques: ${data.eco_events.slice(0,2).join(", ")}`, "warn");

      const strong = data.signals.filter(s=>s.strength==="FORT");
      strong.slice(0,3).forEach(s=>toast(`🔔 ${s.pair} ${s.timeframe} — ${s.candle_emoji} ${s.candle_type} ${s.direction} · R/R ${s.ratio}:1`,"alert"));

      if(data.signals.length>0)
        toast(`📡 ${data.signals.length} signal(s) sur ${data.timeframe} · ${data.pairs_scanned} paires analysées`,"info");
      else
        toast(`📡 Aucun setup ${data.timeframe} validé sur ${data.pairs_scanned} paires`,"info");

      // Notifications push navigateur
      if(strong.length>0 && Notification.permission==="granted")
        new Notification("Sophie Trading",{body:`${strong.length} signal(s) FORT(s) sur ${S.selectedTF}`});
    }
  }catch(e){
    console.error(e);
    setStatus("error");
    toast("⚠️ Erreur de connexion au serveur","warn");
  }

  document.getElementById("progBar").style.width="100%";
  setTimeout(()=>document.getElementById("progBar").style.width="0",500);
  if(btn){btn.disabled=false;btn.className="scan-btn";btn.textContent=`▶ SCANNER SUR ${S.selectedTF}`;}
  S.scanning=false;
  renderSidebar();
  renderTabContent();
}

async function refreshPrices(){
  try{
    const r=await fetch(`${API}/api/prices`);
    const d=await r.json();
    if(d.prices){
      S.prices=d.prices;
      updateTicker(d.prices);
      renderSidebar();
      if(S.activeTab==="prices") renderTabContent();
      toast(`✅ Cours rafraîchis · ${new Date().toLocaleTimeString("fr-FR")}`,"info");
    }
  }catch(e){ toast("⚠️ Erreur rafraîchissement","warn"); }
}

// ── STATS ──────────────────────────────────────────────────────────────────
function updateStats(sigs){
  document.getElementById("stTotal").textContent  = sigs.filter(s=>s.alert_level==="CONFIRME").length;
  document.getElementById("stStrong").textContent = sigs.filter(s=>s.alert_level==="SUR_ZONE").length;
  document.getElementById("stMed").textContent    = sigs.filter(s=>s.alert_level==="EN_APPROCHE").length;
  document.getElementById("stWeak").textContent   = sigs.length;
}

function updateTicker(prices){
  const html = Object.entries(prices).filter(([,v])=>v).map(([pair,price])=>{
    const sig=S.signals.find(s=>s.pair===pair);
    const c=sig?sc(sig.strength):"#6a8aaa";
    return `<span class="ticker-item" style="color:${c}">
      <span style="color:#c8d8e8;font-weight:600">${pair}</span>
      <span>${fmtP(price,pair)}</span>
      ${sig?`<span style="color:${dc(sig.direction)}">${sig.direction}</span>`:""}
    </span>`;
  }).join("");
  if(html) document.getElementById("ticker").innerHTML=html;
}

      <div>
        <div class="price-lbl">ZONE ${a.zone_type}</div>
        <div style="font-size:13px;font-family:monospace;color:#f5c842;font-weight:600">${fmtP(a.price_zone,a.pair)}</div>
        <div style="font-size:7px;color:#3a5068;margin-top:3px">${a.zone_touches} retests · qualité ${a.zone_quality}%</div>
        ${a.zone_psych?`<div style="font-size:7px;color:#a78bff;margin-top:2px">● Niveau psychologique</div>`:""}
        <div style="font-size:7px;color:#3a5068;margin-top:5px">MM100: <span style="color:#3399ff">${a.mm100_pos||"—"}</span></div>
        ${a.tp_fantome?`<div style="font-size:7px;color:#ff9944;margin-top:3px">⚠ TP fantome: ${a.tp_fantome}</div>`:""}
      </div>

      <!-- R/R -->
      <div>
        ${a.ratio?`
        <div class="price-lbl">R/R</div>
        <div style="font-size:22px;font-weight:700;font-family:monospace;color:${a.ratio>=3?"#00ff9d":"#f5c842"}">${a.ratio}:1</div>
        <div style="font-size:7px;color:#3a5068;margin-top:3px">ATR: ${fmtP(a.atr,a.pair)}</div>
        `:`<div style="font-size:8px;color:#3a5068;padding:8px 0">R/R calculé<br>apres confirmation</div>`}
      </div>

      <!-- CE QUI MANQUE -->
      <div>
        ${a.manque && a.manque.length ? `
        <div style="background:rgba(245,200,66,.05);border:1px solid rgba(245,200,66,.2);border-radius:7px;padding:10px 12px">
          <div style="font-size:7px;letter-spacing:2px;color:#f5c842;margin-bottom:7px">POUR CONFIRMER :</div>
          ${a.manque.map(m=>`
            <div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:5px">
              <span style="color:#f5c842;font-size:9px;flex-shrink:0">→</span>
              <span style="font-size:8px;color:#c8d8e8;line-height:1.5">${m}</span>
            </div>
          `).join("")}
        </div>
        ` : `
        <div style="background:rgba(0,255,157,.05);border:1px solid rgba(0,255,157,.2);border-radius:7px;padding:10px 12px">
          <div style="font-size:7px;letter-spacing:2px;color:#00ff9d;margin-bottom:5px">CONFIRMATION COMPLETE ✓</div>
          <div style="font-size:8px;color:#c8d8e8">Toutes les conditions validees.<br>Verifiez sur TradingView.</div>
          ${a.psych_levels&&a.psych_levels.length?`<div style="font-size:7px;color:#3a5068;margin-top:6px">Psy: ${a.psych_levels.slice(0,3).join(" | ")}</div>`:""}
        </div>
        `}
        <div style="font-size:7px;color:#3a5068;margin-top:6px">
          Tendance: ${a.trend} · Force ${a.trend_force}%<br>
          Session: ${a.session||"—"}
        </div>
      </div>
    </div>
  </div>`;
}

// ── INTERACTIONS ───────────────────────────────────────────────────────────
function setTF(tf){
  S.selectedTF=tf;
  renderSidebar();
  toast(`⏱ Timeframe ${tf} sélectionné — cliquez SCANNER pour analyser`,"info");
}
function setTab(t){
  S.activeTab=t;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById(`tab-${t}`)?.classList.add("active");
  renderTabContent();
}
function setFilter(type,val){
  if(type==="s") S.filterStrength=val;
  else           S.filterDir=val;
  renderTabContent();
}
function togglePair(p){
  if(S.selectedPairs.has(p)){if(S.selectedPairs.size>1)S.selectedPairs.delete(p);}
  else S.selectedPairs.add(p);
  renderSidebar();
}
function selectGroup(g){
  S.selectedPairs=new Set(g==="major"?MAJOR:g==="minor"?MINOR:[...MAJOR,...MINOR]);
  renderSidebar();
}
function toggleDrawer(){
  const d=document.getElementById("drawer");
  const o=document.getElementById("overlay");
  const open=d.classList.toggle("open");
  o.style.display=open?"block":"none";
}
function toggleAuto(){
  S.autoScan=!S.autoScan;
  const btn=document.getElementById("autoBtn");
  const dot=document.getElementById("autoDot");
  const lbl=document.getElementById("autoLbl");
  btn.className=`hbtn hbtn-auto ${S.autoScan?"on":"off"}`;
  dot.className=`dot ${S.autoScan?"dot-g":"dot-r"}`;
  lbl.textContent=S.autoScan?"AUTO ON":"AUTO OFF";
  toast(S.autoScan?"🔄 Auto-scan activé (60s)":"⏹ Auto-scan désactivé", S.autoScan?"alert":"info");
}

// ── COUNTDOWN + AUTO ───────────────────────────────────────────────────────
setInterval(()=>{
  S.countdown--;
  if(S.countdown<=0){
    S.countdown=60;
    if(S.autoScan) runScan();
  }
  const el=document.getElementById("cntdown");
  if(el) el.innerHTML=`SYNC : <span style="color:#00ff9d">${S.countdown}s</span>`;
},1000);

// ── RESPONSIVE ──────────────────────────────────────────────────────────────
function applyResponsive(){
  const b=document.getElementById("burgerBtn");
  if(b) b.style.display=S.isDesktop()?"none":"";
}
window.addEventListener("resize",()=>{applyResponsive();renderSidebar();renderTabContent();});

// ── INIT ───────────────────────────────────────────────────────────────────
function init(){
  applyResponsive();
  if(Notification&&Notification.permission==="default") Notification.requestPermission();
  renderSidebar();
  renderTabContent();
  refreshPrices();
}
window.addEventListener("load", init);
</script>
</body>
</html>
